<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MiniFlix video player.">
  <link rel="icon" href="assets/images/fav.png" type="image/png">
  <link rel="stylesheet" href="assets/css/home.css"><title>MiniFlix - Player</title>
</head>
<body data-mode="player" data-root=".">
  <main class="player-page">
    <div class="player-top"><a href="Home.html" id="backToHome">← Back to MiniFlix</a><img src="assets/images/MINIFLIX-LOGO.png" alt="MiniFlix" width="118"></div>
    <section class="player-stage">
      <h1 id="playerTitle">Loading title…</h1>
      <video id="video" controls playsinline preload="metadata" hidden></video>
      <p id="playerStatus" class="player-status" role="status">Loading catalogue…</p>
    </section>
  </main>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
