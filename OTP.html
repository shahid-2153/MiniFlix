<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="/assets/images/fav.png" type="image/x-icon">
    <title>MiniFlix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav-bar {
            border-bottom: 3px solid #e6e6e6;
            height: 70px;
            max-width: 100%;
            display: flex;
            align-items: center;
        }

        .Logo {
            margin-bottom: 30px;
        }

        .box {
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            border: 3px solid black;
            padding: 50px;
            width: 600px;
            transform: translate(-50%, -50%);
            border-radius: 10px;
        }

        .logo {
            margin-left: 30px;
            float: left;
        }

        .Sign-out-btn {
            color: white;
            background-color: #e50914;
            border-radius: 10px;
            padding: 5px 15px;
            font-size: large;
            margin-top: 25px;
            margin-bottom: 25px;
            float: right;
            margin-left: auto;
            border: none;
            border: 1px solid #e50914;
            margin-right: 50px;
        }

        .header {
            text-align: center;
            font-weight: 500;
        }

        .header h4 {
            padding: 10px;
        }

        .inputs {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input {
            width: 40px;
            height: 50px;
            margin: 0 5px;
            text-align: center;
            font-size: 36px;
        }

        .Done {
            color: white;
            background-color: #e50914;
            border-radius: 10px;
            padding: 5px 15px;
            font-size: large;
            margin-top: 25px;
            border: none;
            border: 1px solid #e50914;
            margin-right: 0;
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <div class="logo">
            <img src="/assets/images/MINIFLIX-LOGO.png" alt="LOGO" width="40%">
        </div>
        <input type="button" value="Sign Out" class="Sign-out-btn" id="log-out-btn">
    </div>
    <div class="box">
        <div class="header">
            <div class="Logo">
                <img src="/assets/images/verification-logo_-removebg-preview.png" alt="">
            </div>
            <h1><b>Verify your email address</b></h1>
            <h4>
                <p id="otp-msg"></p>
            </h4>
            <div id="inputs" class="inputs" style="display:none;">
                <input class="input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="OTP digit 1" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 2" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 3" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 4" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 5" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 6" />
            </div>
        </div>
        <input type="button" value="I have verified my email" class="Done" id="done-btn">
        <button type="button" id="resend-btn" style="display:block;margin:14px auto 0;background:none;border:0;color:#e50914;cursor:pointer;">Resend code</button>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script>

document.addEventListener("DOMContentLoaded", () => {
  const supabase = window.supabaseClient;
  const email = (localStorage.getItem("userEmail") || "").trim();
  const message = document.getElementById("otp-msg");
  const resend = document.getElementById("resend-btn");
  const verifyButton = document.getElementById("done-btn");

  if (!email) { window.location.replace("MiniFlix.html"); return; }

  message.textContent = "A verification link has been sent to " + email + ". Open the email and click the link to verify your account. You will then be redirected to MiniFlix.";
  message.style.color = "#222";

  verifyButton.addEventListener("click", async () => {
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error) { show(error.message, true); return; }
    if (session) {
      localStorage.removeItem("pendingUsername");
      localStorage.removeItem("userEmail");
      window.location.href = "Home.html";
    } else {
      show("Please click the verification link in your email first.", true);
    }
  });

  resend.addEventListener("click", async () => {
    resend.disabled = true;
    resend.textContent = "Sending...";
    const { error } = await supabase.auth.resend({
      type: "signup",
      email,
      options: { emailRedirectTo: window.location.origin + "/Home.html" }
    });
    show(error ? error.message : "A new verification email has been sent. Check your inbox and spam folder.", !!error);
    resend.disabled = false;
    resend.textContent = "Resend verification email";
  });

  document.getElementById("log-out-btn").addEventListener("click", () => {
    localStorage.removeItem("pendingUsername");
    localStorage.removeItem("userEmail");
    window.location.href = "MiniFlix.html";
  });

  function show(text, isError) {
    message.textContent = text;
    message.style.color = isError ? "red" : "green";
  }
});

</body>

</html>
