<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/images/fav.png" type="image/png"><title>MiniFlix - Demo Verification</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
    .box{width:min(580px,100%);padding:36px 28px;text-align:center;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 28px #0000000d}
    .logo{width:135px;max-width:45vw;margin-bottom:16px}h1{font-size:clamp(23px,4vw,30px)}#otp-msg{min-height:38px;color:#555;line-height:1.5}
    #demo-code{display:inline-block;padding:9px 14px;background:#fff4d6;border-radius:5px;font-weight:700;letter-spacing:1px}
    .inputs{display:flex;justify-content:center;gap:10px;margin:24px 0}.input{width:52px;height:58px;text-align:center;font-size:26px;border:1px solid #aaa;border-radius:6px}
    .Done{width:100%;padding:13px;color:#fff;background:#e50914;border:0;border-radius:5px;font-size:16px;cursor:pointer}
    .logout{display:inline-block;margin-top:18px;color:#555}.note{color:#777;font-size:12px;line-height:1.5}
  </style>
</head>
<body data-mode="otp">
  <main class="box">
    <a href="MiniFlix.html"><img class="logo" src="assets/images/MINIFLIX-LOGO.png" alt="MiniFlix"></a>
    <h1>Verify your demo account</h1><p id="otp-msg" role="status"></p><p id="demo-code"></p>
    <div id="inputs" class="inputs" aria-label="Four digit verification code">
      <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1">
      <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
      <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
      <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
    </div>
    <button type="button" class="Done" id="done-btn">Verify</button>
    <p class="note">This code is shown here because MiniFlix has no email or authentication backend. It is a demo flow, not real email verification.</p>
    <a class="logout" href="Login.html" id="log-out-btn">Cancel and sign in</a>
  </main>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
