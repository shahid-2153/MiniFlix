<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="/assets/images/fav.png" type="image/x-icon">
    <title>MiniFlix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav-bar {
            border-bottom: 3px solid #e6e6e6;
            height: 70px;
            max-width: 100%;
            display: flex;
            align-items: center;
        }

        .Logo {
            margin-bottom: 30px;
        }

        .box {
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            border: 3px solid black;
            padding: 50px;
            width: 600px;
            transform: translate(-50%, -50%);
            border-radius: 10px;
        }

        .logo {
            margin-left: 30px;
            float: left;
        }

        .Sign-out-btn {
            color: white;
            background-color: #e50914;
            border-radius: 10px;
            padding: 5px 15px;
            font-size: large;
            margin-top: 25px;
            margin-bottom: 25px;
            float: right;
            margin-left: auto;
            border: none;
            border: 1px solid #e50914;
            margin-right: 50px;
        }

        .header {
            text-align: center;
            font-weight: 500;
        }

        .header h4 {
            padding: 10px;
        }

        .inputs {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input {
            width: 40px;
            height: 50px;
            margin: 0 5px;
            text-align: center;
            font-size: 36px;
        }

        .Done {
            color: white;
            background-color: #e50914;
            border-radius: 10px;
            padding: 5px 15px;
            font-size: large;
            margin-top: 25px;
            border: none;
            border: 1px solid #e50914;
            margin-right: 0;
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <div class="logo">
            <img src="/assets/images/MINIFLIX-LOGO.png" alt="LOGO" width="40%">
        </div>
        <input type="button" value="Sign Out" class="Sign-out-btn" id="log-out-btn">
    </div>
    <div class="box">
        <div class="header">
            <div class="Logo">
                <img src="/assets/images/verification-logo_-removebg-preview.png" alt="">
            </div>
            <h1><b>Great, now let's verify your email id</b></h1>
            <h4>
                <p id="otp-msg"></p>
            </h4>
            <div id="inputs" class="inputs">
                <input class="input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="OTP digit 1" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 2" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 3" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 4" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 5" />
                <input class="input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 6" />
            </div>
        </div>
        <input type="button" value="Submit" class="Done" id="done-btn">
        <button type="button" id="resend-btn" style="display:block;margin:14px auto 0;background:none;border:0;color:#e50914;cursor:pointer;">Resend code</button>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script>

document.addEventListener("DOMContentLoaded", () => {
  const supabase=window.supabaseClient;
  const wrap=document.getElementById("inputs");
  const inputs=Array.from(wrap.querySelectorAll("input"));
  const submit=document.getElementById("done-btn");
  const resend=document.getElementById("resend-btn");
  const email=(localStorage.getItem("userEmail")||"").trim();
  const message=document.getElementById("otp-msg");
  if (!email) { window.location.replace("MiniFlix.html"); return; }
  message.textContent="We sent a 6-digit verification code to "+email+".";
  wrap.addEventListener("input",event=>{
    const field=event.target;
    if (!inputs.includes(field)) return;
    field.value=field.value.replace(/\D/g,"").slice(0,1);
    if (field.value) inputs[inputs.indexOf(field)+1]?.focus();
  });
  wrap.addEventListener("keydown",event=>{
    if(event.key==="Backspace" && !event.target.value) inputs[inputs.indexOf(event.target)-1]?.focus();
  });
  wrap.addEventListener("paste",event=>{
    const pasted=(event.clipboardData||window.clipboardData).getData("text").replace(/\D/g,"").slice(0,6);
    if(!pasted)return;
    event.preventDefault();
    inputs.forEach((field,index)=>field.value=pasted[index]||"");
    inputs[Math.min(pasted.length,5)].focus();
  });
  submit.addEventListener("click",async()=>{
    const token=inputs.map(field=>field.value).join("");
    if(token.length!==6){show("Please enter the complete 6-digit OTP.",true);return;}
    submit.disabled=true;submit.value="Verifying...";
    const {data,error}=await supabase.auth.verifyOtp({email,token,type:"signup"});
    if(error){show(error.message||"Invalid or expired OTP. Try again.",true);submit.disabled=false;submit.value="Submit";return;}
    const name=localStorage.getItem("pendingUsername")||data.user?.user_metadata?.display_name||email.split("@")[0];
    localStorage.setItem("username",name);
    localStorage.removeItem("pendingUsername");localStorage.removeItem("userEmail");
    window.location.href="Home.html";
  });
  resend.addEventListener("click",async()=>{
    resend.disabled=true;
    const {error}=await supabase.auth.resend({type:"signup",email});
    show(error?error.message:"A new verification code has been sent.",!!error);
    resend.disabled=false;
  });
  document.getElementById("log-out-btn").addEventListener("click",()=>{
    localStorage.removeItem("pendingUsername");localStorage.removeItem("userEmail");
    window.location.href="MiniFlix.html";
  });
  function show(text,isError){message.textContent=text;message.style.color=isError?"red":"green";}
});
    </script>
</body>

</html>
