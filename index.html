<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MiniFlix movie catalogue demo.">
  <link rel="icon" href="/assets/images/fav.png" type="image/png"><title>MiniFlix</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#101010;color:#fff;font-family:Arial,sans-serif}
    .loader-wrap{text-align:center}.loader{width:66px;height:66px;margin:0 auto 20px;border:6px solid #555;border-top-color:#e50914;border-radius:50%;animation:spin .8s linear infinite}
    img{width:150px;max-width:45vw;object-fit:contain}@keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.loader{animation:none}}
  </style>
  <script>window.addEventListener("DOMContentLoaded",()=>{window.setTimeout(()=>window.location.replace("MiniFlix.html"),900);});</script>
</head>
<body><div class="loader-wrap"><div class="loader" aria-hidden="true"></div><img src="/assets/images/MINIFLIX-LOGO.png" alt="MiniFlix"><p>Loading MiniFlix…</p></div></body>
</html>
