<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="/assets/images/fav.png" type="image/x-icon">
    <title>MiniiFlix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.5;
            width: 100%;
            height: 100%;
        }

        .box {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 4px;
            padding: 70px;
            width: 580px;
            transform: translate(-50%, -50%);
        }

        .nav-bar {
            border-bottom: 3px solid #e6e6e6;
            height: 70px;
            max-width: 100%;
            display: flex;
            align-items: center;
        }

        .logo {
            margin-left: 30px;
            float: left;
        }

        .Login-btn {
            color: white;
            background-color: #e50914;
            border-radius: 10px;
            padding: 5px 15px;
            font-size: large;
            margin-left: auto;
            margin-right: 50px;
        }

        .header {
            text-align: center;
            font-weight: 500;
        }

        .reg-input {
            position: relative;
        }

        label {
            cursor: default;
        }

        .box form {
            margin: 25px 0 65px;
        }

        form .reg-input {
            height: 50px;
            position: relative;
            margin-bottom: 25px;
        }

        .reg-input input {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            font-size: 1rem;
            padding-top: 10px;
            padding-left: 20px;
            border: 1px solid #ccc;
        }

        .reg-input label {
            position: absolute;
            left: 20px;
            top: 25%;
            font-size: 1rem;
            color: rgb(153, 149, 149);
            pointer-events: none;
        }

        .input:focus+.label-input {
            top: 0.2rem;
            font-size: 13px;
            transition: 0.3s;
        }

        .input:not(:placeholder-shown).input:not(:focus)+.label-input {
            top: 0.2rem;
            font-size: 13px;
        }

        .Next-btn {
            width: 100%;
            padding: 16px 0;
            font-size: 1.3rem;
            background: #e50914;
            color: #fff;
            font-weight: 500;
            border-radius: 4px;
            border: none;
            outline: none;
            margin: 10px 0;
            cursor: pointer;
            transition: 0.1s ease;
        }

        .error-msg {
            color: red;
            position: absolute;
            top: 104%;
            left: 4%;
            font-size: 13px;
        }

        .fa-circle-xmark {
            color: red;
            position: absolute;
            left: -0.2%;
            top: 108%;
            display: none;
        }
    </style>
</head>

<body>
    <div class="nav-bar">
        <div class="logo">
            <img src="/assets/images/MINIFLIX-LOGO.png" alt="LOGO ERROR" width="40%">
        </div>
        <button class="Login-btn" id="login-btn" onclick="location.href='Login.html'">Login In</button>
    </div>
    <div class="box">
        <div class="header">
            <h2><b>Fill details to complete your registration.</b></h2>
            <p style="font-size:12px;color:#777;margin:10px 0 16px;">Your account is created through MiniFlix authentication. <a href="Privacy.html" style="color:#b20710;">Read our privacy notice</a>.</p>
            <form id="reg-form">
                <div class="reg-input">
                    <input type="text" name="usr-id" id="user" class="input" placeholder=" ">
                    <label for="user" class="label-input" id="username">Create Username</label>
                    <i class="fa-regular fa-circle-xmark" id="errorIcon"></i>
                    <div id="user-error" class="error-msg"></div>
                </div>
                <div class="reg-input">
                    <input type="password" name="password" id="pswd" class="input" placeholder=" ">
                    <label for="password" class="label-input">Password</label>
                    <i class="fa-regular fa-circle-xmark" id="errorIconPswd"></i>
                    <div id="pswd-error" class="error-msg"></div>
                </div>
                <div class="reg-input">
                    <input type="password" name="confirmpassword" id="cnfrm-pswd" class="input" placeholder=" ">
                    <label for="Confirmpassword" class="label-input">Confirm Password</label>
                    <i class="fa-regular fa-circle-xmark" id="errorIconCnfrmPswd"></i>
                    <div id="cnfrm-pswd-error" class="error-msg"></div>
                </div>
                <button type="submit" class="Next-btn" id="Nxt-btn">Next</button>
            </form>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script>

document.addEventListener("DOMContentLoaded", () => {
  const supabase = window.supabaseClient;
  const form = document.getElementById("reg-form");
  const email = (localStorage.getItem("userEmail") || "").trim();
  const usernameInput = document.getElementById("user");
  const passwordInput = document.getElementById("pswd");
  const confirmInput = document.getElementById("cnfrm-pswd");
  if (!email) { window.location.replace("MiniFlix.html"); return; }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearErrors();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;
    let valid = true;
    if (!username) { setError("user-error","Username is required.","user","errorIcon"); valid = false; }
    if (!password) { setError("pswd-error","Password is required.","pswd","errorIconPswd"); valid = false; }
    else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/.test(password)) {
      setError("pswd-error","Use 8+ characters with uppercase, lowercase, number and symbol.","pswd","errorIconPswd"); valid = false;
    }
    if (!confirmPassword) { setError("cnfrm-pswd-error","Please confirm your password.","cnfrm-pswd","errorIconCnfrmPswd"); valid = false; }
    else if (password !== confirmPassword) { setError("cnfrm-pswd-error","Passwords do not match.","cnfrm-pswd","errorIconCnfrmPswd"); valid = false; }
    if (!valid) return;

    const button = document.getElementById("Nxt-btn");
    button.disabled = true; button.textContent = "Creating account...";
    try {
      const { data, error } = await supabase.auth.signUp({
        email, password, options: { data: { display_name: username }, emailRedirectTo: `${window.location.origin}/Home.html` }
      });
      if (error) throw error;
      localStorage.setItem("pendingUsername", username);
      if (data.session) {
        localStorage.setItem("username", username);
        localStorage.removeItem("pendingUsername");
        localStorage.removeItem("userEmail");
        window.location.href = "Home.html";
      } else {
        window.location.href = "OTP.html";
      }
    } catch (error) {
      setError("pswd-error", error.message || "Registration failed. Please try again.", "pswd", "errorIconPswd");
      button.disabled = false; button.textContent = "Next";
    }
  });

  function setError(e,m,i,icon) {
    document.getElementById(e).textContent=m;
    document.getElementById(i).style.borderColor="red";
    document.getElementById(icon).style.display="inline";
  }
  function clearErrors() {
    ["user-error","pswd-error","cnfrm-pswd-error"].forEach(id=>document.getElementById(id).textContent="");
    ["user","pswd","cnfrm-pswd"].forEach(id=>document.getElementById(id).style.borderColor="");
    ["errorIcon","errorIconPswd","errorIconCnfrmPswd"].forEach(id=>document.getElementById(id).style.display="none");
  }
});
    </script>
</body>

</html>
