<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/images/fav.png" type="image/png"><title>MiniFlix - Create Account</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#222;background:#f5f5f5}
    .nav-bar{height:76px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid #ddd;background:#fff}
    .nav-bar img{width:140px;max-width:42vw}.login-link{margin-left:auto;color:#fff;background:#e50914;padding:10px 18px;text-decoration:none;border-radius:5px}
    .box{width:min(560px,calc(100% - 32px));margin:44px auto;padding:34px;background:#fff;border:1px solid #e4e4e4;border-radius:9px;box-shadow:0 8px 28px #0000000d}
    h1{font-size:25px;text-align:center;margin:0 0 26px}.reg-input{margin:18px 0}.reg-input label{display:block;margin-bottom:7px;font-size:14px;color:#444}
    .reg-input input{width:100%;height:46px;border:1px solid #bbb;border-radius:5px;padding:10px 12px;font-size:16px}
    .error-msg{min-height:18px;margin-top:5px;color:#d93025;font-size:12px}.Next-btn{width:100%;border:0;border-radius:5px;padding:13px;color:white;background:#e50914;font-size:17px;cursor:pointer}
    .Next-btn:disabled{opacity:.65;cursor:wait}.note{color:#666;font-size:12px;line-height:1.5;margin:17px 0 0}
  </style>
</head>
<body data-mode="register">
  <div class="nav-bar"><a href="MiniFlix.html"><img src="assets/images/MINIFLIX-LOGO.png" alt="MiniFlix"></a><a class="login-link" href="Login.html">Log in</a></div>
  <main class="box"><h1>Create your MiniFlix demo account</h1><form id="reg-form">
    <div class="reg-input"><label for="user">Username</label><input type="text" name="username" id="user" autocomplete="username" minlength="3" required><div id="user-error" class="error-msg" role="alert"></div></div>
    <div class="reg-input"><label for="pswd">Password</label><input type="password" name="password" id="pswd" autocomplete="new-password" required><div id="pswd-error" class="error-msg" role="alert"></div></div>
    <div class="reg-input"><label for="cnfrm-pswd">Confirm password</label><input type="password" name="confirmPassword" id="cnfrm-pswd" autocomplete="new-password" required><div id="cnfrm-pswd-error" class="error-msg" role="alert"></div></div>
    <button type="submit" class="Next-btn" id="Nxt-btn">Continue</button>
    <p class="note">Demo only: this static frontend stores a local account in this browser. It does not create a server account or send real email.</p>
  </form></main>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
