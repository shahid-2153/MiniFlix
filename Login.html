<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/images/fav.png" type="image/png"><title>MiniFlix - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;background:linear-gradient(#000b,#000c),url("https://assets.nflxext.com/ffe/siteui/vlv3/a1dc92ca-091d-4ca9-a05b-8cd44bbfce6a/f9368347-e982-4856-a5a4-396796381f28/RS-en-20191230-popsignuptwotwoweeks-perspective_alpha_website_large.jpg") center/cover fixed}
    .nav-bar{padding:20px 28px}.nav-bar img{width:145px;max-width:45vw}.header{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:20px}
    .box{width:min(420px,100%);padding:38px;background:rgba(0,0,0,.82);border-radius:10px;box-shadow:0 0 20px #0008}
    h1{margin:0 0 28px;text-align:center;font-size:30px}.input-group{position:relative;margin:22px 0}
    .input-group input{width:100%;height:48px;padding:12px;color:#fff;background:#222;border:1px solid #555;border-radius:5px}
    .input-group label{display:block;margin-bottom:7px;color:#ddd}.error-msg{min-height:18px;color:#ff7777;font-size:12px;margin-top:5px}
    .remember{display:flex;align-items:center;gap:8px;color:#ddd;font-size:14px;margin:8px 0 18px}
    button{width:100%;padding:12px;color:#fff;background:#e50914;border:0;border-radius:5px;font-size:16px;font-weight:700}
    button:disabled{opacity:.65;cursor:wait}.sign-up-btn{margin:20px 0 0;text-align:center;color:#ddd;font-size:14px}.sign-up-btn a{color:#ff747c}
    @media(max-width:480px){.box{padding:26px 20px}}
  </style>
</head>
<body data-mode="login">
  <div class="nav-bar"><a href="MiniFlix.html"><img src="assets/images/MINIFLIX-LOGO.png" alt="MiniFlix"></a></div>
  <main class="header"><div class="box"><form id="login-form">
    <h1>LOGIN</h1>
    <div class="input-group"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required><i class="fa-regular fa-circle-xmark" id="username-error-icon" aria-hidden="true" style="display:none"></i><div id="username-error" class="error-msg" role="alert"></div></div>
    <div class="input-group"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required><i class="fa-regular fa-circle-xmark" id="password-error-icon" aria-hidden="true" style="display:none"></i><div id="password-error" class="error-msg" role="alert"></div></div>
    <label class="remember"><input type="checkbox" id="remember-me"> Remember me on this device</label>
    <button type="submit" id="login-btn">Login</button>
    <p class="sign-up-btn">Don't have an account? <a href="MiniFlix.html">Sign up</a></p>
  </form></div></main>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
