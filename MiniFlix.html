<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/images/fav.png" type="image/png"><title>MiniFlix - Watch Movies and Anime</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;background:linear-gradient(110deg,#080808ee,#08080888),url("assets/images/Avengers big.webp") center/cover fixed}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,5vw,64px)}
    .logo{width:190px;max-width:42vw}.login-btn{padding:10px 20px;border:0;border-radius:5px;background:#e50914;color:white;font-size:16px}
    .hero{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 20px}
    .hero h1{max-width:850px;margin:0 0 16px;font-size:clamp(32px,5.8vw,58px);line-height:1.1}
    .hero p{max-width:700px;font-size:18px;line-height:1.5;color:#eee}
    .email-form{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;width:min(660px,100%);margin-top:16px}
    .email-input{width:min(430px,100%);height:54px;padding:12px 16px;border:1px solid #aaa;border-radius:4px;font-size:17px}
    .submit-btn{height:54px;padding:0 24px;border:0;border-radius:4px;background:#e50914;color:#fff;font-size:17px;font-weight:700}
    .error-msg{min-height:20px;color:#ff9da2;font-size:13px}.demo-note{max-width:700px;margin-top:18px;font-size:12px!important;color:#ccc!important}
    @media(max-width:520px){.hero p{font-size:15px}.email-form{flex-direction:column}.email-input,.submit-btn{width:100%}}
  </style>
</head>
<body data-mode="landing">
  <header><nav class="navbar"><a href="index.html"><img src="assets/images/MINIFLIX-LOGO.png" class="logo" alt="MiniFlix"></a><button class="login-btn" onclick="location.href='Login.html'">Log In</button></nav></header>
  <main class="hero">
    <h1>Watch Movies, Series and Anime.</h1>
    <p>Enter your email to start creating a MiniFlix demo account.</p>
    <form id="reg-form">
      <div class="email-form">
        <input type="email" name="email" id="emailField" class="email-input" placeholder="Email address" autocomplete="email" required>
        <button type="submit" class="submit-btn">Get Started</button>
      </div>
      <i class="fa-regular fa-circle-xmark" id="errorIcon" aria-hidden="true" style="display:none"></i>
      <div id="error" class="error-msg" role="alert"></div>
    </form>
    <p class="demo-note">MiniFlix is a frontend demo. It does not provide real email verification or stream media until you add video files.</p>
  </main>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
